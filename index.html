<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Santri - SMP IT Putra Abu Hurairah Mataram</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --light-color: #f8fafc;
            --dark-color: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark-color);
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            animation: slideDown 0.5s ease;
        }

        .school-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .school-logo {
            width: 60px;
            height: 60px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            margin-right: 20px;
        }

        .school-name {
            flex: 1;
        }

        .school-name h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .school-name p {
            color: #64748b;
            margin: 0;
        }

        .date-time {
            text-align: right;
            color: var(--dark-color);
        }

        .date-time h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .date-time p {
            margin: 0;
            color: #64748b;
        }

        .content-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.8s ease;
        }

        .form-section h2, .attendance-section h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
        }

        .form-section h2 i, .attendance-section h2 i {
            margin-right: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
            color: var(--dark-color);
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            padding: 12px 15px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn-primary {
            background: var(--primary-color);
            border: none;
            border-radius: 10px;
            padding: 12px 25px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
        }

        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .student-card {
            background: var(--light-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .student-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .student-info {
            display: flex;
            align-items: center;
        }

        .student-avatar {
            width: 45px;
            height: 45px;
            background: var(--secondary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: 15px;
        }

        .student-details h4 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .student-details p {
            margin: 0;
            font-size: 14px;
            color: #64748b;
        }

        .attendance-status {
            display: flex;
            gap: 8px;
        }

        .status-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #e2e8f0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .status-btn:hover {
            transform: scale(1.1);
        }

        .status-btn.active {
            border-color: var(--primary-color);
        }

        .status-btn.present.active {
            background: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .status-btn.sick.active {
            background: var(--warning-color);
            color: white;
            border-color: var(--warning-color);
        }

        .status-btn.permission.active {
            background: var(--secondary-color);
            color: white;
            border-color: var(--secondary-color);
        }

        .status-btn.absent.active {
            background: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        .submit-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .attendance-summary {
            display: flex;
            gap: 20px;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .summary-item i {
            font-size: 18px;
        }

        .summary-item.present i {
            color: var(--success-color);
        }

        .summary-item.sick i {
            color: var(--warning-color);
        }

        .summary-item.permission i {
            color: var(--secondary-color);
        }

        .summary-item.absent i {
            color: var(--danger-color);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            display: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #e2e8f0;
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: translateX(150%);
            transition: transform 0.3s ease;
            z-index: 9999;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: var(--success-color);
        }

        .notification.error {
            background: var(--danger-color);
        }

        .notification.info {
            background: var(--secondary-color);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .school-info {
                flex-direction: column;
                text-align: center;
            }

            .school-logo {
                margin-right: 0;
                margin-bottom: 15px;
            }

            .date-time {
                text-align: center;
                margin-top: 15px;
            }

            .students-grid {
                grid-template-columns: 1fr;
            }

            .submit-section {
                flex-direction: column;
                gap: 20px;
            }

            .attendance-summary {
                width: 100%;
                justify-content: space-around;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="notification" id="notification"></div>

    <div class="main-container">
        <header class="header">
            <div class="school-info">
                <div style="display: flex; align-items: center;">
                    <div class="school-logo">PAH</div>
                    <div class="school-name">
                        <h1>SMP IT Putra Abu Hurairah Mataram</h1>
                        <p>Sistem Absensi Santri</p>
                    </div>
                </div>
                <div class="date-time">
                    <h3 id="currentDate"></h3>
                    <p id="currentTime"></p>
                </div>
            </div>
        </header>

        <main>
            <div class="content-card form-section">
                <h2><i class="bi bi-calendar-check"></i> Form Absensi</h2>
                <form id="attendanceForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="teacherSelect">Pengajar</label>
                                <select class="form-select" id="teacherSelect" required>
                                    <option value="" selected disabled>Pilih Pengajar</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="classSelect">Kelas</label>
                                <select class="form-select" id="classSelect" required>
                                    <option value="" selected disabled>Pilih Kelas</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="subjectSelect">Mata Pelajaran</label>
                                <select class="form-select" id="subjectSelect" required>
                                    <option value="" selected disabled>Pilih Mata Pelajaran</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="timeSelect">Waktu</label>
                                <select class="form-select" id="timeSelect" required>
                                    <option value="" selected disabled>Pilih Waktu</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="content-card attendance-section">
                <h2><i class="bi bi-people"></i> Data Absensi Santri</h2>
                <div id="studentsContainer" class="students-grid">
                    <!-- Students will be loaded here -->
                </div>
                <div class="submit-section">
                    <div class="attendance-summary">
                        <div class="summary-item present">
                            <i class="bi bi-check-circle-fill"></i>
                            <span>Hadir: <span id="presentCount">0</span></span>
                        </div>
                        <div class="summary-item sick">
                            <i class="bi bi-droplet-fill"></i>
                            <span>Sakit: <span id="sickCount">0</span></span>
                        </div>
                        <div class="summary-item permission">
                            <i class="bi bi-file-text-fill"></i>
                            <span>Izin: <span id="permissionCount">0</span></span>
                        </div>
                        <div class="summary-item absent">
                            <i class="bi bi-x-circle-fill"></i>
                            <span>Tanpa Keterangan: <span id="absentCount">0</span></span>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="submitAttendance">
                        <i class="bi bi-save"></i> Simpan Absensi
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Configuration
        const SPREADSHEET_ID_DATA = '1Xbmc-yjk90QySKKE8gyiiZCL4SoVlnjRPUQwZfyvuaY';
        const SPREADSHEET_ID_ABSEN = '1EdDABw7e9k-8DeAhEzUVfSKrr8S0xiQIp-DX0ErH1oI';
        const API_KEY = 'AIzaSyB8v7o3n8l9o2b3c4d5e6f7g8h9i0j1k2l3';
        
        // Global variables
        let teachers = [];
        let classes = [];
        let subjects = [];
        let timeSlots = [];
        let students = [];
        let attendanceData = {};

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            updateDateTime();
            setInterval(updateDateTime, 1000);
            loadData();
            setupEventListeners();
        });

        // Update date and time
        function updateDateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('id-ID', options);
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('id-ID');
        }

        // Load data from Google Sheets
        async function loadData() {
            showLoading(true);
            try {
                // Load teachers
                teachers = await loadSheetData('guru');
                populateTeacherSelect();
                
                // Load classes
                classes = await loadSheetData('kelas');
                populateClassSelect();
                
                // Load subjects
                subjects = await loadSheetData('mapel');
                populateSubjectSelect();
                
                // Load time slots
                timeSlots = await loadSheetData('jam');
                populateTimeSelect();
                
                showNotification('Data berhasil dimuat', 'success');
            } catch (error) {
                console.error('Error loading data:', error);
                showNotification('Gagal memuat data. Silakan coba lagi.', 'error');
            } finally {
                showLoading(false);
            }
        }

        // Load data from specific sheet
        async function loadSheetData(sheetName) {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID_DATA}/values/${sheetName}?key=${API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.values && data.values.length > 1) {
                const headers = data.values[0];
                const rows = data.values.slice(1);
                
                return rows.map(row => {
                    const obj = {};
                    headers.forEach((header, index) => {
                        obj[header] = row[index] || '';
                    });
                    return obj;
                });
            }
            return [];
        }

        // Populate teacher select
        function populateTeacherSelect() {
            const select = document.getElementById('teacherSelect');
            select.innerHTML = '<option value="" selected disabled>Pilih Pengajar</option>';
            
            teachers.forEach(teacher => {
                const option = document.createElement('option');
                option.value = teacher.nama || '';
                option.textContent = teacher.nama || '';
                select.appendChild(option);
            });
        }

        // Populate class select
        function populateClassSelect() {
            const select = document.getElementById('classSelect');
            select.innerHTML = '<option value="" selected disabled>Pilih Kelas</option>';
            
            classes.forEach(cls => {
                const option = document.createElement('option');
                option.value = cls.kelas || '';
                option.textContent = cls.kelas || '';
                select.appendChild(option);
            });
        }

        // Populate subject select
        function populateSubjectSelect() {
            const select = document.getElementById('subjectSelect');
            select.innerHTML = '<option value="" selected disabled>Pilih Mata Pelajaran</option>';
            
            subjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject.mapel || '';
                option.textContent = subject.mapel || '';
                select.appendChild(option);
            });
        }

        // Populate time select
        function populateTimeSelect() {
            const select = document.getElementById('timeSelect');
            select.innerHTML = '<option value="" selected disabled>Pilih Waktu</option>';
            
            timeSlots.forEach(slot => {
                const option = document.createElement('option');
                option.value = slot.jam || '';
                option.textContent = slot.jam || '';
                select.appendChild(option);
            });
        }

        // Load students when class is selected
        async function loadStudents() {
            const selectedClass = document.getElementById('classSelect').value;
            
            if (!selectedClass) {
                document.getElementById('studentsContainer').innerHTML = '<p class="text-center text-muted">Silakan pilih kelas terlebih dahulu</p>';
                return;
            }
            
            showLoading(true);
            try {
                students = await loadSheetData(selectedClass);
                renderStudents();
                resetAttendanceData();
            } catch (error) {
                console.error('Error loading students:', error);
                showNotification('Gagal memuat data santri. Silakan coba lagi.', 'error');
            } finally {
                showLoading(false);
            }
        }

        // Render students
        function renderStudents() {
            const container = document.getElementById('studentsContainer');
            container.innerHTML = '';
            
            if (students.length === 0) {
                container.innerHTML = '<p class="text-center text-muted">Tidak ada santri di kelas ini</p>';
                return;
            }
            
            students.forEach((student, index) => {
                const studentId = student.nis || `student-${index}`;
                attendanceData[studentId] = {
                    nis: student.nis || '',
                    nama: student.nama || '',
                    kelas: document.getElementById('classSelect').value,
                    status: ''
                };
                
                const studentCard = document.createElement('div');
                studentCard.className = 'student-card';
                studentCard.innerHTML = `
                    <div class="student-info">
                        <div class="student-avatar">${student.nama ? student.nama.charAt(0).toUpperCase() : 'S'}</div>
                        <div class="student-details">
                            <h4>${student.nama || 'Tidak ada nama'}</h4>
                            <p>NIS: ${student.nis || 'Tidak ada NIS'}</p>
                        </div>
                    </div>
                    <div class="attendance-status">
                        <div class="status-btn present" data-student="${studentId}" data-status="hadir" title="Hadir">
                            <i class="bi bi-check"></i>
                        </div>
                        <div class="status-btn sick" data-student="${studentId}" data-status="sakit" title="Sakit">
                            <i class="bi bi-droplet"></i>
                        </div>
                        <div class="status-btn permission" data-student="${studentId}" data-status="izin" title="Izin">
                            <i class="bi bi-file-text"></i>
                        </div>
                        <div class="status-btn absent" data-student="${studentId}" data-status="tanpa keterangan" title="Tanpa Keterangan">
                            <i class="bi bi-x"></i>
                        </div>
                    </div>
                `;
                container.appendChild(studentCard);
            });
            
            // Add event listeners to status buttons
            document.querySelectorAll('.status-btn').forEach(btn => {
                btn.addEventListener('click', handleStatusChange);
            });
        }

        // Handle status change
        function handleStatusChange(e) {
            const studentId = e.currentTarget.dataset.student;
            const status = e.currentTarget.dataset.status;
            
            // Remove active class from all buttons for this student
            document.querySelectorAll(`.status-btn[data-student="${studentId}"]`).forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Add active class to clicked button
            e.currentTarget.classList.add('active');
            
            // Update attendance data
            attendanceData[studentId].status = status;
            
            // Update summary
            updateSummary();
        }

        // Reset attendance data
        function resetAttendanceData() {
            attendanceData = {};
            students.forEach((student, index) => {
                const studentId = student.nis || `student-${index}`;
                attendanceData[studentId] = {
                    nis: student.nis || '',
                    nama: student.nama || '',
                    kelas: document.getElementById('classSelect').value,
                    status: ''
                };
            });
            updateSummary();
        }

        // Update summary
        function updateSummary() {
            let presentCount = 0;
            let sickCount = 0;
            let permissionCount = 0;
            let absentCount = 0;
            
            Object.values(attendanceData).forEach(student => {
                switch (student.status) {
                    case 'hadir':
                        presentCount++;
                        break;
                    case 'sakit':
                        sickCount++;
                        break;
                    case 'izin':
                        permissionCount++;
                        break;
                    case 'tanpa keterangan':
                        absentCount++;
                        break;
                }
            });
            
            document.getElementById('presentCount').textContent = presentCount;
            document.getElementById('sickCount').textContent = sickCount;
            document.getElementById('permissionCount').textContent = permissionCount;
            document.getElementById('absentCount').textContent = absentCount;
        }

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('classSelect').addEventListener('change', loadStudents);
            document.getElementById('submitAttendance').addEventListener('click', submitAttendance);
        }

        // Submit attendance
        async function submitAttendance() {
            // Validate form
            const teacher = document.getElementById('teacherSelect').value;
            const className = document.getElementById('classSelect').value;
            const subject = document.getElementById('subjectSelect').value;
            const time = document.getElementById('timeSelect').value;
            
            if (!teacher || !className || !subject || !time) {
                showNotification('Silakan lengkapi form absensi terlebih dahulu', 'error');
                return;
            }
            
            // Check if all students have attendance status
            const studentsWithoutStatus = Object.values(attendanceData).filter(student => !student.status);
            if (studentsWithoutStatus.length > 0) {
                showNotification('Ada santri yang belum dicatat kehadirannya', 'error');
                return;
            }
            
            showLoading(true);
            
            try {
                // Prepare data for submission
                const attendanceRecords = Object.values(attendanceData).map(student => {
                    return [
                        new Date().toISOString().split('T')[0], // Tanggal
                        time, // Jam
                        teacher, // Pengajar
                        className, // Kelas
                        subject, // Mapel
                        student.nis, // NIS
                        student.nama, // Nama
                        student.status // Kehadiran
                    ];
                });
                
                // Submit to Google Sheets
                await submitToGoogleSheets(attendanceRecords);
                
                showNotification('Data absensi berhasil disimpan', 'success');
                
                // Reset form after successful submission
                setTimeout(() => {
                    document.getElementById('attendanceForm').reset();
                    document.getElementById('studentsContainer').innerHTML = '<p class="text-center text-muted">Silakan pilih kelas terlebih dahulu</p>';
                    resetAttendanceData();
                }, 2000);
                
            } catch (error) {
                console.error('Error submitting attendance:', error);
                showNotification('Gagal menyimpan data absensi. Silakan coba lagi.', 'error');
            } finally {
                showLoading(false);
            }
        }

        // Submit data to Google Sheets
        async function submitToGoogleSheets(data) {
            // This is a simplified approach. In a real application, you would need to:
            // 1. Use Google Sheets API with proper authentication
            // 2. Or use Google Apps Script as a backend service
            
            // For this demo, we'll simulate the submission
            // In a real implementation, you would need to set up OAuth2 authentication
            
            // Simulate API call
            return new Promise((resolve) => {
                setTimeout(() => {
                    console.log('Submitting data to Google Sheets:', data);
                    resolve({ success: true });
                }, 1500);
            });
            
            // Real implementation would look something like this:
            /*
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID_ABSEN}/values/abs:append?valueInputOption=USER_ENTERED&key=${API_KEY}`;
            
            const response = await fetch(url, {
                method: 'POST',
